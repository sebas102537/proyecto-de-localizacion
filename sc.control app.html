const TG={r:{m:'Manómetro',v:'Válvula',s:'Señalización',d:'Drenaje',o:'Sin monitoreo',p:'Presión anómala'},g:{e:'Sin extintor',x:'Extintor vencido',t:'Extintor vence en octubre',a:'Acrílico',h:'Manguera',v:'Válvula angular',g:'Golpe o antigolpes',c:'Chapa o anclaje',z:'Extintor sobredimensionado',k:'Verificar en sitio',s:'Señalización',i:'Dotación incompleta'}};
const parse=(raw,p)=>raw.trim().split('\n').map((l,i)=>{const[n,g,s,d,st,t,o]=l.split('|');return{id:p+String(i+1).padStart(2,'0'),n:n.trim(),g,s:s||'',d:(d||'').trim(),st:+st,t:[...(t||'')],o}});
const D={r:parse(R,'R'),g:parse(G,'G')};
const SN=['Operativo','Con novedad','Corregido'],SV=['--ok','--nv','--co'];
let C='r',F='all',T=null,Q='',S=false,LV=null;
const $=i=>document.getElementById(i),pad=n=>String(n).padStart(2,'0');
const lv=x=>{const m=(x.g+' '+x.n).match(/Cubierta|Sótano \d|Piso \d+[AB]?|Nivel 0/i);return m?m[0].replace(/^./,c=>c.toUpperCase()):'Sin nivel definido'};
const lk=l=>{let m=l.match(/Sótano (\d)/);if(m)return-m[1];m=l.match(/Piso (\d+)([AB]?)/);if(m)return+m[1]+(m[2]=='A'?.3:m[2]=='B'?.6:0);return l=='Nivel 0'?0:l=='Cubierta'?100:101};
const hay=x=>(x.id+' '+x.n+' '+x.g+' '+x.s+' '+x.o).toLowerCase();
function match(x,q){if(!q)return true;q=q.replace(/^sistema\s+/,'');if(C=='r'){if(D.r.some(y=>y.s.toLowerCase()==q))return x.s.toLowerCase()==q;const m=q.match(/^r0*(\d+)$/);if(m)return x.id==='R'+pad(m[1])}if(/^\d+$/.test(q))return(C=='r'&&x.id.slice(1)==pad(q))||new RegExp('(^|\\D)'+q+'(\\D|$)').test(x.n);return hay(x).includes(q)}
const col=s=>`var(${SV[s]})`;
function sc(x){return x.st==0?0:x.st}
function chips(x){return x.t.length?`<div class="tg">${x.t.map(k=>`<span class="${k=='t'&&C=='g'?'t':''}">${TG[C][k]}</span>`).join('')}</div>`:''}
function render(){
 const A=D[C];$('q').placeholder=C=='r'?'Sistema (ej. X o AM), código (ej. R12), piso o zona…':'Número (ej. 13), piso o zona…';$('cr').textContent=D.r.length;$('cg').textContent=D.g.length;
 const n=[0,1,2].map(s=>A.filter(x=>x.st==s).length);
 $('sts').innerHTML=[['Total',A.length,'--ac'],['Operativos',n[0],'--ok'],['Con novedad',n[1],'--nv'],['Corregidos',n[2],'--co']].map(([a,b,c])=>`<div class="stat" style="--c:var(${c})"><b>${b}</b><span>${a} · ${C=='r'?'risers':'gabinetes'}</span></div>`).join('');
 $('fl').innerHTML=[['all','Todos'],[1,'Con novedad'],[0,'Operativos'],[2,'Corregidos']].map(([k,l])=>`<button class="chip ${F==k?'on':''}" data-f="${k}">${l}</button>`).join('')+(C=='r'?`<button class="chip ${S?'on':''}" data-s="1">Sin letra de sistema (${A.filter(x=>!x.s).length})</button>`:'');
 const lc={};A.forEach(x=>{const l=lv(x);lc[l]=(lc[l]||0)+1});
 $('lv').innerHTML='<h3>Por ubicación <span style="color:var(--mu);font-weight:400">(toca un nivel para filtrar)</span></h3><div class="chips" style="margin:0">'+Object.keys(lc).sort((a,b)=>lk(a)-lk(b)).map(l=>`<button class="chip ${LV==l?'on':''}" data-l="${l}">${l} · ${lc[l]}</button>`).join('')+'</div>';
 const cnt={};A.forEach(x=>x.t.forEach(k=>cnt[k]=(cnt[k]||0)+1));
 const ks=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]),mx=Math.max(1,...Object.values(cnt));
 $('dm').innerHTML=`<h3>Errores y daños reportados <span style="color:var(--mu);font-weight:400">(toca para filtrar)</span></h3>`+ks.map(k=>`<button class="bar ${T==k?'on':''}" data-t="${k}"><span>${TG[C][k]}</span><i style="width:${cnt[k]/mx*100}%"></i><span>${cnt[k]}</span></button>`).join('');
 const L=A.filter(x=>(F=='all'||x.st==F)&&(!T||x.t.includes(T))&&(!S||!x.s)&&(!LV||lv(x)==LV)&&match(x,Q));
 $('ct').textContent=`${L.length} de ${A.length} ${C=='r'?'risers':'gabinetes'}`;
 $('ls').innerHTML=L.length?L.map(x=>`<button class="card" style="--c:${col(x.st)}" data-i="${x.id}"><div class="top"><h4>${C=='g'&&x.n[0]=='#'?'Gabinete ':''}${x.n}</h4><span class="id">${x.s?'Sistema '+x.s+' · '+x.id:x.id}</span></div><p>${x.g}${x.d?' · '+x.d:''} · <span class="st" style="--c:${col(x.st)}">${SN[x.st]}</span></p>${chips(x)}</button>`).join(''):'<div class="emp">Sin resultados. Prueba con otro número o quita los filtros.</div>';
}
function open(id){const x=D[C].find(y=>y.id==id);if(!x)return;
 $('dl').innerHTML=`<div class="top"><h3 style="margin:0">${C=='g'&&x.n[0]=='#'?'Gabinete ':''}${x.n}</h3><span class="id">${x.id}</span></div><div class="st" style="--c:${col(x.st)};margin-top:6px">● ${SN[x.st]}</div><dl><dt>Nivel</dt><dd>${lv(x)}</dd><dt>Ubicación</dt><dd>${x.g}</dd>${x.s?`<dt>Sistema</dt><dd>${x.s}</dd>`:''}${x.d?`<dt>Revisión</dt><dd>${x.d}</dd>`:''}<dt>Reporte</dt><dd>${x.o}</dd></dl>${chips(x)}<button class="x" onclick="$('dl').close()">Cerrar</button>`;
 $('dl').showModal()}
function sug(){const q=Q;const b=$('sg');if(!q){b.hidden=true;return}
 const L=D[C].filter(x=>match(x,q)).slice(0,7);
 b.innerHTML=L.map(x=>`<button data-i="${x.id}"><span class="id">${x.s?x.s:x.id}</span><span>${C=='g'&&x.n[0]=='#'?'Gabinete ':''}${x.n}<small>${x.g}</small></span></button>`).join('');
 b.hidden=!L.length}
$('q').addEventListener('input',e=>{Q=e.target.value.trim().toLowerCase();render();sug()});
$('q').addEventListener('keydown',e=>{if(e.key=='Enter'||e.key=='Escape')$('sg').hidden=true});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){$('sg').hidden=true;return}
 if(b.dataset.c){C=b.dataset.c;F='all';T=null;Q='';S=false;LV=null;$('q').value='';document.querySelectorAll('.tabs button').forEach(t=>t.classList.toggle('on',t==b));$('sg').hidden=true;render()}
 else if(b.dataset.f!==undefined){F=b.dataset.f=='all'?'all':+b.dataset.f;render()}
 else if(b.dataset.l!==undefined){LV=LV==b.dataset.l?null:b.dataset.l;render()}
 else if(b.dataset.s){S=!S;render()}
 else if(b.dataset.t){T=T==b.dataset.t?null:b.dataset.t;render()}
 else if(b.dataset.i){$('sg').hidden=true;open(b.dataset.i)}
 else if(!b.closest('.sb'))$('sg').hidden=true});
$('th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark';try{localStorage.setItem('sc-theme',r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem('sc-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('lg').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
render();
